<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">FinFlow 시스템 아키텍처</title>
  <desc id="desc">Spring Security JWT, AOP 검증, 서비스 계층, Redis 멱등성, MySQL 정합성 저장소와 향후 Kafka Outbox 구성을 나타낸 다이어그램</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
      .node-title { font-size: 18px; font-weight: 750; }
      .node-copy { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .box { filter: url(#shadow); stroke-width: 1.5; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .future { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <text x="800" y="62" text-anchor="middle" class="title">FinFlow 시스템 아키텍처</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">금융 거래 정합성 · 동시성 제어 · 멱등성 처리 중심</text>

  <!-- Entry points -->
  <rect x="110" y="135" width="250" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" class="box"/>
  <text x="235" y="176" text-anchor="middle" class="node-title">Client</text>
  <text x="235" y="202" text-anchor="middle" class="node-copy">Web · Mobile · API Client</text>

  <rect x="110" y="285" width="250" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="235" y="326" text-anchor="middle" class="node-title">k6 Load Test</text>
  <text x="235" y="351" text-anchor="middle" class="node-copy">Cache Hit · SET NX Race</text>

  <!-- Application boundary -->
  <rect x="430" y="125" width="1060" height="650" rx="28" fill="#ffffff" fill-opacity="0.68" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="161" class="section">SPRING BOOT APPLICATION</text>

  <!-- Security -->
  <rect x="485" y="190" width="285" height="125" rx="18" fill="#eff6ff" stroke="#60a5fa" class="box"/>
  <text x="627" y="225" text-anchor="middle" class="node-title">Spring Security · JWT</text>
  <text x="627" y="252" text-anchor="middle" class="node-copy">Login → JWT 발급</text>
  <text x="627" y="276" text-anchor="middle" class="node-copy">토큰 검증 · 역할 기반 인가</text>
  <text x="627" y="298" text-anchor="middle" class="small">Stateless SecurityContext</text>

  <!-- Controller / AOP -->
  <rect x="835" y="190" width="285" height="125" rx="18" fill="#f0fdfa" stroke="#2dd4bf" class="box"/>
  <text x="977" y="225" text-anchor="middle" class="node-title">Controller · Spring AOP</text>
  <text x="977" y="252" text-anchor="middle" class="node-copy">회원 · 계좌 · 거래 API</text>
  <text x="977" y="276" text-anchor="middle" class="node-copy">POST/PUT 요청 검증</text>
  <text x="977" y="298" text-anchor="middle" class="small">공통 ResponseDTO · 예외 응답</text>

  <rect x="1185" y="190" width="250" height="125" rx="18" fill="#f8fafc" stroke="#94a3b8" class="box"/>
  <text x="1310" y="225" text-anchor="middle" class="node-title">Global Exception</text>
  <text x="1310" y="252" text-anchor="middle" class="node-copy">@RestControllerAdvice</text>
  <text x="1310" y="276" text-anchor="middle" class="node-copy">검증 · API · 권한 오류</text>

  <!-- Service layer -->
  <text x="485" y="365" class="section">SERVICE LAYER</text>
  <rect x="485" y="390" width="285" height="145" rx="18" fill="#f8fafc" stroke="#94a3b8" class="box"/>
  <text x="627" y="425" text-anchor="middle" class="node-title">Core Services</text>
  <text x="627" y="453" text-anchor="middle" class="node-copy">UserService · AccountService</text>
  <text x="627" y="477" text-anchor="middle" class="node-copy">TransactionService</text>
  <text x="627" y="506" text-anchor="middle" class="small">도메인 규칙 · 트랜잭션 경계</text>

  <rect x="835" y="390" width="285" height="145" rx="18" fill="#f5f3ff" stroke="#a78bfa" class="box"/>
  <text x="977" y="425" text-anchor="middle" class="node-title">Redis Idempotency</text>
  <text x="977" y="453" text-anchor="middle" class="node-copy">완료 응답 우선 조회</text>
  <text x="977" y="477" text-anchor="middle" class="node-copy">SET NX 진행 요청 선점</text>
  <text x="977" y="506" text-anchor="middle" class="small">TTL · 장애 시 DB 폴백</text>

  <rect x="1185" y="390" width="250" height="145" rx="18" fill="#ecfdf5" stroke="#34d399" class="box"/>
  <text x="1310" y="425" text-anchor="middle" class="node-title">Transfer Transaction</text>
  <text x="1310" y="453" text-anchor="middle" class="node-copy">Idempotency Record</text>
  <text x="1310" y="477" text-anchor="middle" class="node-copy">계좌번호 순서대로 DB Lock</text>
  <text x="1310" y="506" text-anchor="middle" class="small">잔액 · 거래내역 원자적 저장</text>

  <!-- Repository layer -->
  <text x="485" y="595" class="section">PERSISTENCE LAYER</text>
  <rect x="485" y="620" width="635" height="105" rx="18" fill="#ffffff" stroke="#64748b" class="box"/>
  <text x="802" y="658" text-anchor="middle" class="node-title">Spring Data JPA · JPQL Repositories</text>
  <text x="802" y="686" text-anchor="middle" class="node-copy">CRUD · Fetch Join · 동적 거래 조회 · JPA Auditing</text>

  <rect x="1185" y="620" width="250" height="105" rx="18" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="1310" y="658" text-anchor="middle" class="node-title">Pessimistic Lock</text>
  <text x="1310" y="686" text-anchor="middle" class="node-copy">PESSIMISTIC_WRITE</text>

  <!-- Data stores -->
  <rect x="520" y="825" width="355" height="135" rx="20" fill="#fff7ed" stroke="#f97316" class="box"/>
  <text x="697" y="865" text-anchor="middle" class="node-title">Redis 7.4</text>
  <text x="697" y="892" text-anchor="middle" class="node-copy">processing key · completed response</text>
  <text x="697" y="920" text-anchor="middle" class="small">성능 최적화 보조 계층</text>

  <rect x="955" y="825" width="355" height="135" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" class="box"/>
  <text x="1132" y="865" text-anchor="middle" class="node-title">MySQL 8.4</text>
  <text x="1132" y="892" text-anchor="middle" class="node-copy">Account · Transaction · IdempotencyRecord</text>
  <text x="1132" y="920" text-anchor="middle" class="small">최종 정합성 · 유니크 제약 · 트랜잭션</text>

  <!-- Future event architecture -->
  <rect x="1350" y="815" width="205" height="155" rx="20" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="1452" y="850" text-anchor="middle" class="node-title">향후 이벤트 처리</text>
  <text x="1452" y="879" text-anchor="middle" class="node-copy">Outbox Publisher</text>
  <text x="1452" y="904" text-anchor="middle" class="node-copy">Apache Kafka</text>
  <text x="1452" y="929" text-anchor="middle" class="node-copy">Idempotent Consumers</text>
  <text x="1452" y="952" text-anchor="middle" class="small">알림 · 감사 · 통계</text>

  <!-- Flows -->
  <path d="M 360 187 L 485 245" class="flow-blue"/>
  <path d="M 360 337 C 410 337, 420 275, 485 265" class="flow"/>
  <path d="M 770 252 L 835 252" class="flow-blue"/>
  <path d="M 1120 252 L 1185 252" class="flow"/>
  <path d="M 977 315 L 977 390" class="flow"/>
  <path d="M 900 315 C 800 350, 705 355, 660 390" class="flow"/>
  <path d="M 1120 462 L 1185 462" class="flow-blue"/>
  <path d="M 770 462 L 835 462" class="flow"/>
  <path d="M 627 535 L 700 620" class="flow"/>
  <path d="M 1310 535 L 1310 620" class="flow-blue"/>
  <path d="M 1185 672 L 1120 672" class="flow-blue"/>
  <path d="M 977 535 C 900 650, 820 735, 697 825" class="flow"/>
  <path d="M 960 725 C 1000 770, 1080 790, 1132 825" class="flow-blue"/>
  <path d="M 1310 725 C 1275 775, 1205 795, 1160 825" class="flow-blue"/>
  <path d="M 1310 895 L 1350 895" class="future"/>

  <!-- Labels -->
  <rect x="768" y="742" width="166" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="851" y="761" text-anchor="middle" class="small">Redis read / write</text>
  <rect x="1014" y="757" width="194" height="28" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1111" y="776" text-anchor="middle" class="small">DB transaction commit</text>

  <!-- Legend -->
  <line x1="110" y1="1010" x2="165" y2="1010" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="180" y="1015" class="small">현재 핵심 처리 흐름</text>
  <line x1="365" y1="1010" x2="420" y2="1010" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="435" y="1015" class="small">향후 구현 예정</text>
  <text x="1490" y="1015" text-anchor="end" class="small">Local infrastructure: Docker Compose</text>
</svg>
