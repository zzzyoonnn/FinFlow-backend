services:
  mysql:
    image: mysql:8.4
    container_name: finflow-mysql
    environment:
      MYSQL_DATABASE: finflow
      MYSQL_USER: finflow
      MYSQL_PASSWORD: finflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - finflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: finflow-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - finflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: finflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  k6:
    image: grafana/k6:0.57.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:8081}
      USERNAME: ${K6_USERNAME:-test}
      PASSWORD: ${K6_PASSWORD:-1234}
      MODE: ${K6_MODE:-redis}
      VUS: ${K6_VUS:-20}
      DURATION: ${K6_DURATION:-30s}
      MAX_DURATION: ${K6_MAX_DURATION:-30s}
      IDEMPOTENCY_KEY: ${K6_IDEMPOTENCY_KEY:-k6-idempotency-retry}
      TEST_SCENARIO: ${BENCHMARK_SCENARIO:-normal}
      RUN_ID: ${BENCHMARK_RUN_ID:-}
      TARGET_RPS: ${BENCHMARK_TARGET_RPS:-100}
      START_RPS: ${BENCHMARK_START_RPS:-25}
      STEADY_RPS: ${BENCHMARK_STEADY_RPS:-50}
      SPIKE_RPS: ${BENCHMARK_SPIKE_RPS:-500}
      PRE_ALLOCATED_VUS: ${BENCHMARK_PRE_ALLOCATED_VUS:-100}
      MAX_VUS: ${BENCHMARK_MAX_VUS:-1000}
      ALLOW_FAILURES: ${BENCHMARK_ALLOW_FAILURES:-false}
      P95_LIMIT_MS: ${BENCHMARK_P95_LIMIT_MS:-500}
      ACCOUNT_PAIRS: ${BENCHMARK_ACCOUNT_PAIRS:-20}
      RAMP_RPS_1: ${BENCHMARK_RAMP_RPS_1:-50}
      RAMP_RPS_2: ${BENCHMARK_RAMP_RPS_2:-100}
      RAMP_RPS_3: ${BENCHMARK_RAMP_RPS_3:-200}
      RAMP_RPS_4: ${BENCHMARK_RAMP_RPS_4:-400}
      RAMP_DURATION_1: ${BENCHMARK_RAMP_DURATION_1:-1m}
      RAMP_DURATION_2: ${BENCHMARK_RAMP_DURATION_2:-1m}
      RAMP_DURATION_3: ${BENCHMARK_RAMP_DURATION_3:-1m}
      RAMP_DURATION_4: ${BENCHMARK_RAMP_DURATION_4:-1m}
      STEADY_DURATION: ${BENCHMARK_STEADY_DURATION:-1m}
      SPIKE_RAMP: ${BENCHMARK_SPIKE_RAMP:-10s}
      SPIKE_DURATION: ${BENCHMARK_SPIKE_DURATION:-30s}
      RECOVERY_RAMP: ${BENCHMARK_RECOVERY_RAMP:-10s}
      RECOVERY_DURATION: ${BENCHMARK_RECOVERY_DURATION:-1m}
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ./loadtest/k6/results:/results
    command: ["run", "/scripts/${K6_SCRIPT:-idempotency-cache-hit.js}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  finflow-mysql-data:
  finflow-redis-data:
