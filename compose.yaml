services:
  mysql:
    image: mysql:8.4
    container_name: finflow-mysql
    environment:
      MYSQL_DATABASE: finflow
      MYSQL_USER: finflow
      MYSQL_PASSWORD: finflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - finflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  finflow-mysql-data:
