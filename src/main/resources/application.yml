spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:finflow-transaction-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false
  profiles:
    active:
      - dev

finflow:
  audit:
    mode: ${AUDIT_MODE:none}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    outbox-enabled: ${OUTBOX_ENABLED:true}
    transaction-topic: finflow.transaction.completed.v1
    outbox-poll-interval: 1000
    outbox-max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    consumer:
      retry-interval: ${KAFKA_CONSUMER_RETRY_INTERVAL:1000}
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
      dlq-suffix: ${KAFKA_DLQ_SUFFIX:.dlq}
    cleanup:
      cron: ${EVENT_CLEANUP_CRON:0 0 3 * * *}
      outbox-retention: ${OUTBOX_RETENTION:7d}
      failed-retention: ${FAILED_OUTBOX_RETENTION:30d}
      processed-retention: ${PROCESSED_EVENT_RETENTION:30d}
