server:
  port: 5000

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Existing installations contain the core V1 tables; V2 adds the event infrastructure.
    baseline-version: 1
  datasource:
    url: jdbc:mysql://${rds.hostname}:${rds.port}/${rds.db.name}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${rds.username}
    password: ${rds.password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "hibernate.default_batch_fetch_size": 100


logging:
  level:
    "com.FinFlow": INFO
